[16,'collapse','崩壊','嵐の塔','雷鳴の轟く嵐の塔。塔（XVI）は、いまにも崩れそうに揺れています。','塔「崩壊は、誰にも止められない。巻き込まれても知らぬぞ。」<br><i>ヒント：相手のターン開始時、場のユニット（敵味方どちらも）の1体にランダムで1ダメージが入ります。</i>','塔側のターン開始時、場のランダムなユニット1体（敵味方問わず）に1ダメージ。','塔「崩れたあとに、新しい道が見える。」<br>塔（XVI）が仲間になりました。'],
[17,'hope','希望','星降る湖','星が水面に降る静かな湖。星（XVII）が、そっと水を注いでいます。','星「希望は、最後まで消えない。傷ついたときこそ、星は輝く。」<br><i>ヒント：相手のライフが半分以下になると、一度だけ6回復します。回復後に押し切る準備をしましょう。</i>','星側は、ライフが半分以下になった次のターン開始時に、1度だけライフ+6。','星「あなたの旅にも、星の光がありますように。」<br>星（XVII）が仲間になりました。'],
[18,'illusion','幻影','月夜の荒野','二匹の犬が吠える月夜の荒野。月（XVIII）が、淡く不安げに光っています。','月「見えるものは、本当の姿ではない。向きさえも、月の光で揺らぐ。」<br><i>ヒント：あなたのターン開始時、手札の小アルカナ1枚の向きがランダムに入れ替わります。魔術師の創造で整えるのも手です。</i>','月側のルール：あなたのターン開始時、手札の小アルカナ1枚の向きが入れ替わる。','月「幻の向こうに、道は続いている。」<br>月（XVIII）が仲間になりました。'],
[19,'vital','活力','陽光の草原','陽光が降り注ぐ草原。太陽（XIX）が、まぶしく笑っています。','太陽「活力があふれてくる！ 私の仲間は、みんな元気いっぱいだ！」<br><i>ヒント：相手のユニットは、常に攻撃+1です。盾や封印で受けつつ戦いましょう。</i>','太陽側の全ユニットの攻撃+1。','太陽「成功は、あなたの隣にある。」<br>太陽（XIX）が仲間になりました。'],
[20,'awakening','目覚め','目覚めの丘','空にラッパが響く目覚めの丘。審判（XX）が、静かに腕を広げています。','審判「目覚めよ、倒れた者たちよ。一度だけ、私の仲間は立ち上がる。」<br><i>ヒント：相手の倒れたユニットが、体力2で一度だけ復活します。復活後の対処も考えておきましょう。</i>','審判側のターン開始時、倒れたユニット1体を、体力2で1度だけ復活させる。','審判「あなたも、目覚めのときを迎えました。」<br>審判（XX）が仲間になりました。'],
[21,'perfect','完成','世界の果て','月桂冠の輪の中で、世界（XXI）が静かに踊っています。ここが、旅の終着点です。','世界「完成とは、すべてが揃うこと。私の仲間は、みな守りを備えている。」<br><i>ヒント：相手のユニットは召喚時に盾を持ちます。最初の攻撃は防がれるので、複数回の攻撃を用意しましょう。仲間の力を結集して、最後の一戦へ。</i>','世界側のユニットは、召喚時に盾を持つ。ライフが35。','世界「旅は完成した。愚者（0）から世界（XXI）まで、あなたは22の道を歩み切ったのです。」<br><b>おめでとうございます！ 愚者の旅は、ここで一つの輪を結びました。</b>']
];
NW.forEach(([n,r,key,loc,p1,p2,rule,post])=>{const M=MAJ[n],su=M.su,same=MAJ.filter(c=>c.su===su&&c.no!==n).map(c=>c.id).slice(0,3),dif=n<=10?1:2;
 CH.push({t:`第${n+1}章「${M.n}」`,foe:M.n,el:SU[su].el,loc,dif,life:n===21?35:n>=16?28:0,m:[M.id,...same],s:[su,FRD[su]],rid:r,key,rule:`「${key}」`+rule,rw:M.id,sum:`ボス固有ルール「${key}」。${['弱い','普通','強い'][dif]}相手です。`,pre:[p1,p2],post})});
const PAL={'火':['#2a1a2e','#8a3a2e'],'水':['#14183a','#2c5a7a'],'風':['#2b3358','#9fb0c8'],'地':['#1f2a22','#6a8a4a']};
const DEC={'火':'<g fill="#e8833a"><path d="M14 90q-7-16 0-26q2 9 8 6q-2 12 4 20zM170 90q-7-16 0-26q2 9 8 6q-2 12 4 20z"/></g>','水':'<g stroke="#8fc4e0" stroke-width="1.4" fill="none" opacity=".8"><path d="M0 80q10-4 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0M0 86q10-4 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0"/></g>','風':'<g stroke="#ece1c6" stroke-width="1.2" fill="none" opacity=".6"><path d="M10 30q18-6 36 0M150 60q18-6 36 0M20 70q14-5 28 0M160 26q14-5 28 0"/></g>','地':'<path d="M0 90V74q30-14 60-4t60-2q40-10 80 6V90z" fill="#14201a" opacity=".85"/>'};
function genScene(i){const c=CH[i],M=MAJ[i],id='gs'+i,pl=PAL[c.el];return`<svg class="scn" viewBox="0 0 200 90" role="img" aria-label="${c.loc}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pl[0]}"/><stop offset="1" stop-color="${pl[1]}"/></linearGradient></defs><rect width="200" height="90" fill="url(#${id})"/>${DEC[c.el]}<g transform="translate(60 3) scale(2)" stroke="#ece1c6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">${MA[M.id]}</g><text x="100" y="87" text-anchor="middle" font-size="8" fill="#ece1c6" opacity=".9" font-family="serif">${M.r}　${M.n}</text></svg>`}
function scene(i){return i<3?SC[i]:genScene(i)}
function stPick(){const a=stM();if(a.length<=5)return a;const x=ST.sel.filter(id=>a.includes(id)).slice(0,5);return x.length===5?x:a.slice(-5)}
function stGo(i){stM().length>5?stDeck(i):stPlay(i)}
function stDeck(i){const a=stM();let x=ST.sel.filter(id=>a.includes(id));if(x.length!==5)x=a.slice(-5);ST.sel=x;stDeckView(i)}
function stTog(i,id){const k=ST.sel.indexOf(id);if(k>=0)ST.sel.splice(k,1);else if(ST.sel.length<5)ST.sel.push(id);stDeckView(i,id)}
function stDeckView(i,v){const a=stM();ov(`<div><h1>デッキ編成</h1><p>仲間の大アルカナから5枚を選びます。小アルカナは、4スートからランダムに15枚入ります。</p><div class="chips">${a.map(id=>`<span class="ch ${ST.sel.includes(id)?'on':''}" onclick="stTog(${i},'${id}')">${MAJ[ix(id)].r} ${MAJ[ix(id)].n}</span>`).join('')}</div><p>選択：${ST.sel.length}/5</p><div class="dx">${v?info(MAJ[ix(v)]):'<i>カードをタップすると解説が出ます。</i>'}</div><button class="p" ${ST.sel.length===5?'':'disabled'} onclick="stPlay(${i})">対戦開始</button><button onclick="stMenu()">章の選択へ</button></div>`,1)}
const stM=()=>['fool',...CH.filter((c,i)=>c.rw&&ST.cl.includes(i)).map(c=>c.rw)];
function stLeave(){ST.on=false;if(ST.bgs){ST.bgs=false;setTrack(0)}if(ST.sd!==undefined){D.dif=ST.sd;ST.sd=undefined}}
function stPlay(i){stSave();if(ST.sd===undefined)ST.sd=D.dif;ST.on=true;ST.ch=i;setTrack(tk(i),true);sfx('chap');newGame()}
function stExit(){stLeave();build()}
function stReset(b){if(b.dataset.c){ST.cl=[];stSave();stMenu()}else{b.dataset.c=1;b.textContent='本当に消去？もう一度押すと進行を消去します'}}
function stMenu(){setTrack(3,true);const un=i=>i===0||ST.cl.includes(i-1);
 ov(`<div><h1>ストーリー</h1><p>愚者の旅（全22章）。大アルカナ1枚が1章に対応し、勝つとそのカードが仲間になります。仲間が5枚を超えたら、章の前にデッキに入れる5枚を選べます。クリア済みの章は何度でも遊べます。</p><div class="dx"><b>仲間</b>：${stM().map(id=>MAJ[ix(id)].n).join('・')}</div>${CH.map((c,i)=>`<div class="dx"><b>${c.t}</b>（${c.foe}・${c.el}）${ST.cl.includes(i)?' ✔クリア済み':''}<br>${c.sum}<button class="p" ${un(i)?'':'disabled'} onclick="stChap(${i})">${un(i)?'この章へ':'前の章をクリアすると解放'}</button></div>`).join('')}<button onclick="stExit()">フリー対戦へ</button><button onclick="intro()">タイトルへ</button><button onclick="stReset(this)">進行をリセット</button></div>`,1)}
function stChap(i){stPage(i,0)}
function stPage(i,k){setTrack(3,true);const c=CH[i],last=k>=c.pre.length-1;
 ov(`<div><h1>${c.t}</h1>${scene(i)}<p><i>${c.foe}（${c.el}）</i></p><p>${c.pre[k]}</p><p style="text-align:center">${k+1} / ${c.pre.length}</p>${last?`${c.rule?`<div class="dx"><b>ボス固有ルール</b><br>${c.rule}</div>`:''}<button class="p" onclick="stGo(${i})">対戦開始</button>`:`<button class="p" onclick="stPage(${i},${k+1})">次へ</button>`}<button onclick="stMenu()">章の選択へ</button></div>`,1)}
function stEnd(){const c=CH[ST.ch],w=G.over==='win',nx=ST.ch<CH.length-1;
 if(w){if(!ST.cl.includes(ST.ch)){ST.cl.push(ST.ch);stSave()}
  const sh=MAJ[ix(c.rw||'fool')];if(!G.sd2){G.sd2=1;sfx('clear',!!c.rw)}
  ov(`<div><h1>${c.t} クリア</h1>${scene(ST.ch)}<p>${c.post}</p><div class="dx"><b>${c.rw?'仲間になったカード':'旅の始まりのカード'}</b><br>${info(sh,null,1)}</div>${nx?`<button class="p" onclick="stChap(${ST.ch+1})">次の章へ</button>`:''}<button ${nx?'':'class="p"'} onclick="stMenu()">章の選択へ</button></div>`,1)
 }else ov(`<div><h1>敗北</h1>${G.resigned?'投了しました。':'ライフが0になりました。'}<br>デッキは変わりません。もう一度挑戦できます。<button class="p" onclick="stPlay(${ST.ch})">この章をやり直す</button>${stM().length>5?`<button onclick="stDeck(${ST.ch})">デッキを編成し直す</button>`:''}<button onclick="stMenu()">章の選択へ</button></div>`,1)}
function flipCard(c){if(c.k!=='m'||!c.R||!c.N)return;if(c.rev){Object.assign(c,c.N);c.rev=false}else{Object.assign(c,c.R);c.rev=true}sfx('flip')}
function bossStart(i){if(!ST.on)return;const h=RH[CH[ST.ch].rid];if(!h)return;if(i===1&&h.boss)h.boss();if(i===0&&h.me)h.me()}
function bossEnd(i){if(!ST.on||i!==1)return;const h=RH[CH[ST.ch].rid];if(h&&h.end)h.end()}
function bossAtk(u){if(!ST.on||u.s!==1)return 0;const r=CH[ST.ch].rid;return r==='vital'||(r==='command'&&G.p[1].field.length>=2)?1:0}
function intu(a){if(!ST.on||ST.ch!==2||!a.hand.length)return'';const c=a.hand[0];return`<br>直感：${c.n}${c.rev?'（逆位置）':''}`}

intro();
