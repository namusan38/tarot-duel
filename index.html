function end(){if(!G.sd){G.sd=1;sfx(G.over)}ov(`<div><h1>${G.over==='win'?'勝利':'敗北'}</h1>${G.over==='win'?'相手のライフを0にしました。':G.resigned?'投了しました。':'ライフが0になりました。'}<button class="p" onclick="newGame()">同じデッキでもう一度</button><button onclick="build()">デッキを組み直す</button></div>`)}
function intro(){ov(`<div><h1>タロット・デュエル</h1>タロット全78枚を使う対戦カードゲームです。大アルカナ22枚はユニット、小アルカナ56枚は魔法・支援として使います。<br><br>・デッキは大アルカナ5枚＋選んだ2スートの小アルカナ15枚<br>・手札をタップ→「使う／召喚する」<br>・攻撃：緑枠の自分のユニットをタップ→相手を選ぶ<br>・相手のユニットがいる間は、ライフへ直接攻撃できません<br>・ユニットは召喚直後や攻撃後は横向き（タップ）になり、次の自分のターンに起き上がります<br>・攻撃力が0のユニットは、自分のターン開始時に1、2、3…と増えるダメージを受けます（ファティーグ）<br>・山札が尽きた状態でカードを引くと、ライフに1、2、3…と増えるダメージを受けます<br>・気力は毎ターン1ずつ増えます（最大10）<br>・小アルカナは、引いた時に約4割が逆位置になり、効果が変わります<br>・大アルカナと同じ相性スートの小アルカナを使うと✦相性が発動します<br><p>${sb()}</p><button class="p" onclick="build()">デッキを組む</button></div>`)}
function build(){const ok=D.m.length===5&&D.s.length===2;ov(`<div><h1>デッキ構築</h1><p>難易度</p><div class="chips">${['弱い','普通','強い'].map((n,i)=>`<span class="ch ${D.dif===i?'on':''}" onclick="D.dif=${i};build()">${n}</span>`).join('')}</div><p>大アルカナを5枚、小アルカナのスートを2つ選びます。</p><div class="chips">${MAJ.map((c,i)=>`<span class="ch ${D.m.includes(i)?'on':''}" onclick="tg('m',${i})">${c.r} ${c.n}</span>`).join('')}</div><div class="chips">${Object.keys(SU).map(s=>`<span class="ch ${D.s.includes(s)?'on':''}" onclick="tg('s','${s}')">${SU[s].n}</span>`).join('')}</div><p>選択：大アルカナ${D.m.length}/5・スート${D.s.length}/2</p><div class="dx">${D.v||'<i>カードをタップすると解説が出ます。</i>'}</div><button onclick="auto()">おまかせで選ぶ</button><button onclick="dex('build')">カード図鑑</button><button class="p" ${ok?'':'disabled'} onclick="newGame()">対戦開始</button></div>`,1)}
function tg(k,x){const a=D[k],n=k==='m'?5:2,i=a.indexOf(x);if(i>=0)a.splice(i,1);else if(a.length<n)a.push(x);D.v=k==='m'?info(MAJ[x]):`<b>${SU[x].n}</b>：${SU[x].el}の象徴。${SU[x].role}。`;build()}
function auto(){D.m=shuf([...Array(22).keys()]).slice(0,5);D.s=shuf('wcsp'.split('')).slice(0,2);D.v='';build()}
function dex(b){DB=b;ov(`<div><h1>カード図鑑</h1><p><b>大アルカナ（22枚）</b></p>${MAJ.map(c=>`<div class="dx">${info(c)}</div>`).join('')}<p><b>小アルカナ（56枚）</b></p>${Object.keys(SU).map(s=>`<div class="dx"><b>${SU[s].n}</b>（${SU[s].el}）：${SU[s].role}<br>${MINS.filter(c=>c.s===s&&c.id.slice(1)>9).map(c=>`${c.n}：${c.d}`).join('<br>')}<br>数札：2が最弱、エースが最強です（2→3→…→10→エースの順に気力と効果が上がります）。<br>2（気力${MINS.find(c=>c.id===s+'1').cost}）：${MINS.find(c=>c.id===s+'1').d}<br>エース（気力${MINS.find(c=>c.id===s+'0').cost}）：${MINS.find(c=>c.id===s+'0').d}<br>エースの逆位置：${MINS.find(c=>c.id===s+'0').R.d}</div>`).join('')}<button class="p" onclick="closeDex()">閉じる</button></div>`,1)}
function closeDex(){DB==='build'?build():$('#ov').style.display='none'}
function fxPlay(c,m){const f=$('#fx');if(!f)return;const M=c.k==='M',col=M?'#d4b062':SU[c.s].c,d=document.createElement('div'),N=M?24:16,R=(a,b)=>a+Math.random()*(b-a);d.className='fx '+(M?'fxM':'fxm fx'+c.s);d.style.setProperty('--fc',col);d.style.setProperty('--dx',m?1:-1);
 let pt='';for(let i=0;i<N;i++)pt+=`<i class="pt" style="--a:${i*360/N}deg;--r:${R(110,260)}px;--x:${R(-130,130)}px;--y:${R(-150,150)}px;--y2:${R(-10,90)}px;--dl:${R(0,.25)}s"></i>`;
 d.innerHTML=`<i class="fl"></i><i class="ring"></i><i class="ring r2"></i>${M?'<i class="ray"></i>':''}${pt}<div class="fcard">${art(c,M?112:84)}<b>${c.n}</b>${M?`<small>${c.r}</small>`:c.rev?'<small>逆位置</small>':''}</div><div class="fban">${M?'召喚':SU[c.s].n+(c.rev?'・逆位置':'')}</div>`;
 f.appendChild(d);if(M){const a=$('#app');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),900)}setTimeout(()=>d.remove(),1500)}
function askResign(){ov(`<div><h1>投了しますか？</h1>投了すると、この対戦は負けになります。<button class="p" onclick="doResign()">投了する</button><button onclick="$('#ov').style.display='none'">続ける</button></div>`)}
function doResign(){G.over='lose';G.resigned=true;log('あなたは投了した');$('#ov').style.display='none';R()}
function resolve(t){if(G.mode==='card')play(0,G.sel.i,t);else{const u=G.p[0].field.find(x=>x.id===G.sel.id);G.sel=G.mode=null;attack(0,u,t)}R()}
$('#app').onclick=e=>{if(G.busy||G.over||G.turn)return;const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,s=+el.dataset.s,me=G.p[0];if(a==='hand'||a==='unit')sfx('sel');else if(a!=='use')sfx('tap');
 if(a==='hand'){G.sel={k:'h',i:+el.dataset.i};G.mode=null;G.view=null}
 else if(a==='use'){const c=me.hand[G.sel.i];if(!canUse(c)){sfx('no');return}if(c.k==='M'||c.t==='self')play(0,G.sel.i,{});else G.mode='card'}
 else if(a==='cancel'){G.sel=G.mode=null}
 else if(a==='dex'){dex('game');return}
 else if(a==='resign'){askResign();return}
 else if(a==='end')endTurn(0);
 else if(a==='face'){if(G.mode&&isT(1,null))return resolve({s:1,u:null})}
 else if(a==='unit'){const u=G.p[s].field.find(x=>x.id==+el.dataset.id);if(G.mode&&isT(s,u))return resolve({s,u});
  if(s===0&&u.atkLeft>0){G.sel={k:'u',id:u.id};G.mode='atk'}else{G.sel=null;G.mode=null}G.view=u}
 R()};
async function runAI(){G.busy=true;R();await sl(800);const p=G.p[1];
 for(let g=0;g<20&&!G.over;g++){let f=null;
  const cs=p.hand.map((c,i)=>({c,i})).filter(x=>x.c.cost<=p.en).sort((a,b)=>(b.c.k==='M')-(a.c.k==='M')||b.c.cost-a.c.cost);
  if(D.dif===0)shuf(cs);for(const x of cs){if(D.dif===0&&Math.random()<.35)continue;const t=aiT(x.c);if(t){f={i:x.i,t};break}}
  if(!f)break;play(1,f.i,f.t);R();await sl(1300)}
 for(const u of [...p.field]){while(!G.over&&u.atkLeft>0&&p.field.includes(u)){const t=aiAtk(u);if(!t)break;attack(1,u,t);R();await sl(800)}}
 G.busy=false;if(!G.over)endTurn(1);else R()}
function aiT(c){const p=G.p[1],o=G.p[0],best=f=>f.slice().sort((a,b)=>A(b)-A(a))[0];
 if(c.k==='M')return p.field.length<4?{}:null;
 if(c.t==='self')return{};
 if(c.t==='ally'){const f=c.rdy?p.field.filter(u=>u.atkLeft>0):p.field;return f.length?{s:1,u:best(f)}:null}
 if(c.t==='eu')return o.field.length?{s:0,u:best(o.field)}:null;
 const k=o.field.find(u=>u.hp<=c.dmg&&!u.shield);return k?{s:0,u:k}:{s:0,u:null}}
function aiAtk(u){const o=G.p[0],a=A(u);if(!o.field.length)return D.dif===0&&Math.random()<.4?null:{s:0,u:null};if(D.dif===0&&Math.random()<.5)return null;
 const ks=o.field.filter(d=>a>=d.hp&&!d.shield&&(u.hp>A(d)||u.shield||(D.dif===2&&d.c.cost>=u.c.cost))).sort((x,y)=>A(y)-A(x));if(ks.length)return{s:0,u:ks[0]};
 const sf=o.field.filter(d=>u.hp>A(d)||u.shield);return sf.length&&Math.random()<[.3,.6,.9][D.dif]?{s:0,u:sf[0]}:null}
intro();
</script></body></html>
